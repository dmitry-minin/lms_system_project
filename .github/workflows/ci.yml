name: Django CI

on: [ push, pull_request ]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user -d test_db" 
          --health-interval 10s 
          --health-timeout 5s 
          --health-retries 5

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Poetry
        run: |
          python -m pip install --upgrade pip
          pip install poetry
          poetry --version

      - name: Cache Poetry dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pypoetry
          key: ${{ runner.os }}-poetry-${{ hashFiles('**/poetry.lock') }}
          restore-keys: |
            ${{ runner.os }}-poetry

      - name: Create .env for CI
        run: |
          cat > .env << 'EOF'
          # Django
          SECRET_KEY=test
          DEBUG=0
          # DB (provide both common naming schemes to match project settings)
          POSTGRES_DB=test_db
          POSTGRES_USER=test_user
          POSTGRES_PASSWORD=test_password
          POSTGRES_HOST=127.0.0.1
          POSTGRES_PORT=5432
          DB_NAME=test_db
          DB_USER=test_user
          DB_PASSWORD=test_password
          DB_HOST=127.0.0.1
          DB_PORT=5432
          EOF

      - name: Install dependencies
        run: poetry install --no-interaction --no-ansi --no-root

      - name: Run migrations
        env:
          SECRET_KEY: test
        run: poetry run python manage.py migrate --noinput

      - name: Run tests
        env:
          SECRET_KEY: test
        run: |
          poetry run coverage run manage.py test -v 2
          poetry run coverage xml -o coverage.xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/myapp:latest
            ${{ secrets.DOCKER_HUB_USERNAME }}/myapp:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Prepare SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Deploy to server
        run: |
          ssh -i ~/.ssh/id_rsa -o IdentitiesOnly=yes -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }} << 'EOF'
            set -e
            # Choose docker command (fallback to sudo docker if needed)
            DOCKER=docker
            if ! $DOCKER info >/dev/null 2>&1; then
              DOCKER="sudo docker"
            fi
            # Ensure Docker Compose V2 is available
            if ! $DOCKER compose version >/dev/null 2>&1; then
              echo "ERROR: Docker Compose V2 not found. Install docker-compose-plugin."; exit 1
            fi

            # Paths
            ENV_FILE="/root/lms_app_test/.env"
            REPO_DIR="/root/lms_app_test"

            # Ensure env file exists (use sudo for root path access)
            if ! sudo test -f "$ENV_FILE"; then
              echo "ERROR: Env file not found at $ENV_FILE"; exit 1
            fi
            sudo sed -i 's/\r$//' "$ENV_FILE"

            # Clone or update repo directly into REPO_DIR (preserving .env)
            if [ ! -d "$REPO_DIR/.git" ]; then
              # If directory exists (for .env), init repo there
              sudo git init "$REPO_DIR"
              sudo git -C "$REPO_DIR" remote add origin https://github.com/${{ github.repository }} || true
            fi
            sudo git -C "$REPO_DIR" fetch --all --prune
            # Checkout the exact commit of this workflow
            sudo git -C "$REPO_DIR" checkout -f ${{ github.sha }} || {
              # Fallback to main if SHA not present (e.g. shallow)
              sudo git -C "$REPO_DIR" checkout -f origin/main;
            }
            sudo git -C "$REPO_DIR" reset --hard ${{ github.sha }} || sudo git -C "$REPO_DIR" reset --hard origin/main

            # Pre-clean: stop previous compose stack and remove conflicting standalone containers
            $DOCKER compose -f "$REPO_DIR/docker-compose.yml" down --remove-orphans || true
            # Remove old containers created outside compose that use global names
            $DOCKER rm -f redis db >/dev/null 2>&1 || true

            # Free port 80: stop host nginx and any containers publishing 80
            if command -v systemctl >/dev/null 2>&1; then
              sudo systemctl stop nginx || true
              sudo systemctl disable nginx || true
            fi
            P80_CONTAINERS=$($DOCKER ps -q --filter publish=80)
            if [ -n "$P80_CONTAINERS" ]; then
              $DOCKER stop -t 5 $P80_CONTAINERS || true
              $DOCKER rm -f $P80_CONTAINERS || true
            fi

            # Set compose env var
            export lv=prod

            # Compose deploy using explicit file (no cd)
            $DOCKER compose -f "$REPO_DIR/docker-compose.yml" pull || true
            $DOCKER compose -f "$REPO_DIR/docker-compose.yml" up -d --remove-orphans

            # Run migrations and collect static
            $DOCKER compose -f "$REPO_DIR/docker-compose.yml" exec -T lms_project python manage.py migrate --noinput
            $DOCKER compose -f "$REPO_DIR/docker-compose.yml" exec -T lms_project python manage.py collectstatic --noinput
          EOF
